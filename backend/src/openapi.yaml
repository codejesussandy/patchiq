openapi: 3.1.0
info:
  title: PatchIQ API
  description: |
    PatchIQ - Enterprise Patch Management System API

    ## Authentication
    Most endpoints require JWT authentication. Include the token in the Authorization header:
    ```
    Authorization: Bearer <access_token>
    ```

    ## Agent API
    The Agent API (`/api/agent/*`) is used by PatchIQ agents to communicate with the backend.
    These endpoints use agent-specific authentication via X-Agent-Id and X-Agent-Version headers.
  version: 1.0.0
  contact:
    name: PatchIQ Support
    email: support@patchiq.io
  license:
    name: Proprietary

servers:
  - url: http://localhost:3007
    description: Local Development
  - url: https://api.patchiq.io
    description: Production

tags:
  - name: Auth
    description: Authentication endpoints
  - name: User
    description: Current user management
  - name: Assets
    description: Asset management
  - name: Agents
    description: Agent management (frontend)
  - name: Agent API
    description: Agent communication endpoints
  - name: Patches
    description: Patch management
  - name: Deployments
    description: Deployment management
  - name: Vulnerabilities
    description: Vulnerability tracking
  - name: Jobs
    description: Job queue management
  - name: Discovery
    description: Network discovery
  - name: Dashboard
    description: Dashboard statistics
  - name: Reports
    description: Report generation
  - name: Settings
    description: System settings

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from /v1/auth/login
    agentAuth:
      type: apiKey
      in: header
      name: X-Agent-Id
      description: Agent identifier for agent API endpoints

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: admin@patchiq.io
        password:
          type: string
          format: password
          example: admin123
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [admin, user]
        isOnboarded:
          type: boolean
        organizationId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hostname:
          type: string
        ipAddress:
          type: string
        macAddress:
          type: string
        osName:
          type: string
        osVersion:
          type: string
        status:
          type: string
          enum: [online, offline, unknown]
        lastSeen:
          type: string
          format: date-time
        agentId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hostname:
          type: string
        platform:
          type: string
        platformVersion:
          type: string
        agentVersion:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, offline]
        isApproved:
          type: boolean
        lastHeartbeat:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    AgentRegistration:
      type: object
      properties:
        hostname:
          type: string
        platform:
          type: string
        platformVersion:
          type: string
        agentVersion:
          type: string
        hardwareId:
          type: string
      required:
        - hostname
        - platform
        - agentVersion
        - hardwareId

    Telemetry:
      type: object
      properties:
        collectedAt:
          type: string
          format: date-time
        cpu:
          type: object
          properties:
            usagePercent:
              type: number
            cores:
              type: integer
            model:
              type: string
        memory:
          type: object
          properties:
            totalBytes:
              type: integer
            usedBytes:
              type: integer
            freeBytes:
              type: integer
            usagePercent:
              type: number
        disk:
          type: object
          properties:
            totalBytes:
              type: integer
            usedBytes:
              type: integer
            freeBytes:
              type: integer
            usagePercent:
              type: number
        systemUptime:
          type: object
          properties:
            uptimeSeconds:
              type: integer
            bootTime:
              type: string
              format: date-time

    Inventory:
      type: object
      properties:
        hardware:
          type: object
        software:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              version:
                type: string
              publisher:
                type: string

    Patch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        version:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        status:
          type: string
          enum: [available, testing, approved, deployed, deprecated]
        releaseDate:
          type: string
          format: date-time

    Vulnerability:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cveId:
          type: string
          example: CVE-2024-1234
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        cvssScore:
          type: number
        publishedDate:
          type: string
          format: date-time

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        pagination:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

paths:
  /health:
    get:
      summary: Health check
      description: Returns the health status of the API
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                  environment:
                    type: string

  # Auth endpoints
  /v1/auth/login:
    post:
      summary: User login
      description: Authenticate a user and receive JWT tokens
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/register:
    post:
      summary: User registration
      description: Register a new user account
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                firstName:
                  type: string
                lastName:
                  type: string
              required:
                - email
                - password
                - firstName
                - lastName
      responses:
        '201':
          description: Registration successful
        '400':
          description: Validation error

  /v1/auth/refresh:
    post:
      summary: Refresh access token
      description: Get a new access token using a refresh token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
                - refreshToken
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string

  # User endpoints
  /v1/user/me:
    get:
      summary: Get current user
      description: Get the currently authenticated user's profile
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # Assets endpoints
  /v1/assets:
    get:
      summary: List assets
      description: Get a paginated list of assets
      tags:
        - Assets
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [online, offline, unknown]
      responses:
        '200':
          description: List of assets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Asset'

  /v1/assets/{id}:
    get:
      summary: Get asset
      description: Get a specific asset by ID
      tags:
        - Assets
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '404':
          description: Asset not found

  /v1/assets/{id}/hardware:
    get:
      summary: Get asset hardware info
      description: Get hardware information for an asset
      tags:
        - Assets
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Hardware information
          content:
            application/json:
              schema:
                type: object

  /v1/assets/{id}/software:
    get:
      summary: Get asset software info
      description: Get installed software for an asset
      tags:
        - Assets
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Software list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    version:
                      type: string
                    publisher:
                      type: string

  /v1/assets/{id}/telemetry:
    get:
      summary: Get asset telemetry
      description: Get current telemetry data for an asset
      tags:
        - Assets
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Telemetry data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Telemetry'

  # Agents endpoints (frontend)
  /v1/agents:
    get:
      summary: List agents
      description: Get a list of all registered agents
      tags:
        - Agents
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, offline]
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'

  /v1/agents/{id}:
    get:
      summary: Get agent
      description: Get a specific agent by ID
      tags:
        - Agents
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Agent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'

  /v1/agents/{id}/approve:
    post:
      summary: Approve agent
      description: Approve a pending agent registration
      tags:
        - Agents
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Agent approved
        '404':
          description: Agent not found

  # Agent API endpoints (for agents)
  /api/agent/register:
    post:
      summary: Register agent
      description: Register a new agent with the backend
      tags:
        - Agent API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRegistration'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  agentId:
                    type: string
                    format: uuid
                  status:
                    type: string
                  message:
                    type: string

  /api/agent/heartbeat:
    post:
      summary: Agent heartbeat
      description: Send a heartbeat to indicate agent is alive
      tags:
        - Agent API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentId:
                  type: string
                  format: uuid
              required:
                - agentId
      responses:
        '200':
          description: Heartbeat received

  /api/agent/inventory:
    post:
      summary: Submit inventory
      description: Submit hardware and software inventory
      tags:
        - Agent API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentId:
                  type: string
                  format: uuid
                inventory:
                  $ref: '#/components/schemas/Inventory'
              required:
                - agentId
                - inventory
      responses:
        '200':
          description: Inventory received

  /api/agent/telemetry:
    post:
      summary: Submit telemetry
      description: Submit current telemetry data
      tags:
        - Agent API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentId:
                  type: string
                  format: uuid
                telemetry:
                  $ref: '#/components/schemas/Telemetry'
              required:
                - agentId
                - telemetry
      responses:
        '200':
          description: Telemetry received

  # Patches endpoints
  /v1/patches:
    get:
      summary: List patches
      description: Get a paginated list of patches
      tags:
        - Patches
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low]
      responses:
        '200':
          description: List of patches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Patch'

  /v1/patches/{id}:
    get:
      summary: Get patch
      description: Get a specific patch by ID
      tags:
        - Patches
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Patch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patch'

  # Vulnerabilities endpoints
  /v1/vulnerabilities:
    get:
      summary: List vulnerabilities
      description: Get a paginated list of vulnerabilities
      tags:
        - Vulnerabilities
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low]
      responses:
        '200':
          description: List of vulnerabilities

  /v1/vulnerabilities/{id}:
    get:
      summary: Get vulnerability
      description: Get a specific vulnerability by ID
      tags:
        - Vulnerabilities
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vulnerability details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vulnerability'

  # Jobs endpoints
  /v1/jobs:
    get:
      summary: List jobs
      description: Get a list of scheduled/running jobs
      tags:
        - Jobs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of jobs

  # Dashboard endpoints
  /v1/dashboard:
    get:
      summary: Dashboard stats
      description: Get dashboard statistics and summaries
      tags:
        - Dashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data

  # Settings endpoints
  /v1/settings:
    get:
      summary: Get settings
      description: Get system settings
      tags:
        - Settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Settings
