version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: patchiq_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: patchiq_dev
    ports:
      - "5004:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - patchiq_network

  postgres_test:
    image: postgres:16-alpine
    container_name: patchiq_db_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: patchiq_test
    ports:
      - "5010:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - patchiq_network

  redis:
    image: redis:7-alpine
    container_name: patchiq_redis
    ports:
      - "5005:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - patchiq_network

  minio:
    image: minio/minio:RELEASE.2022-05-26T05-48-41Z
    container_name: patchiq_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: patchiq_admin
      MINIO_ROOT_PASSWORD: patchiq_secret_key
    ports:
      - "5006:9000"   # S3 API
      - "5007:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - patchiq_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: patchiq_backend
    environment:
      - NODE_ENV=development
      - PORT=5002
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/patchiq_dev
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=patchiq_admin
      - MINIO_SECRET_KEY=patchiq_secret_key
      - MINIO_BUCKET=patches
      - MINIO_USE_SSL=false
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - patchiq_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  patchiq_network:
    driver: bridge
