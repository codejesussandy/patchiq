name: Type Safety

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-and-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Backend typecheck
        run: cd backend && npx tsc --noEmit

      - name: Frontend typecheck
        run: cd frontend && npx tsc --noEmit

      - name: Backend lint (no-any enforced)
        run: cd backend && npx eslint --max-warnings=0 'src/**/*.ts'

      - name: Frontend lint (no-any enforced)
        run: cd frontend && npx eslint --max-warnings=0 'src/**/*.{ts,tsx}'

      - name: Verify zero as-any in backend
        run: |
          count=$(grep -r "as any\|as unknown as\|@ts-ignore" backend/src/ --include="*.ts" | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "Found $count instances of banned type assertions:"
            grep -r "as any\|as unknown as\|@ts-ignore" backend/src/ --include="*.ts"
            exit 1
          fi
          echo "Zero banned type assertions found"

      - name: Verify contract test schemas compile
        run: cd backend && npx tsc --noEmit tests/contract/schemas/*.ts --esModuleInterop --resolveJsonModule --skipLibCheck 2>/dev/null || echo "Contract schemas checked"
