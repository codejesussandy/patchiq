name: Agent Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux builds
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          # macOS builds
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          # Windows builds
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Install goversioninfo (Windows only)
        if: matrix.goos == 'windows'
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Embed Windows resources (Windows only)
        if: matrix.goos == 'windows'
        working-directory: ./agent
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Update version in versioninfo.json
          sed -i "s/\"FileVersion\": \"[^\"]*\"/\"FileVersion\": \"${VERSION#v}.0\"/g" assets/versioninfo.json
          sed -i "s/\"ProductVersion\": \"[^\"]*\"/\"ProductVersion\": \"${VERSION#v}.0\"/g" assets/versioninfo.json

          # Generate resource file
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            $(go env GOPATH)/bin/goversioninfo -64 -o=resource.syso assets/versioninfo.json
          else
            $(go env GOPATH)/bin/goversioninfo -arm -o=resource.syso assets/versioninfo.json
          fi

          echo "Version info embedded for Windows ${{ matrix.goarch }}"

      - name: Build binary
        working-directory: ./agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OUTPUT_NAME="patchify-agent-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi

          go build \
            -ldflags="-s -w -X main.version=${VERSION#v} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "../dist/${OUTPUT_NAME}" \
            ./cmd/agent

          echo "Built: ${OUTPUT_NAME}"
          ls -lh "../dist/${OUTPUT_NAME}"

          # Clean up resource file
          if [ "${{ matrix.goos }}" = "windows" ]; then
            rm -f resource.syso
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  sign-windows:
    name: Sign Windows Binaries
    runs-on: windows-latest
    needs: build
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && secrets.WINDOWS_CERTIFICATE_BASE64 != '')

    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows binary artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-windows-${{ matrix.goarch }}
          path: dist

      - name: Decode and import certificate
        if: secrets.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # Decode certificate from base64
          $certBytes = [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          $certPath = Join-Path $env:TEMP "signing-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          Write-Host "Certificate decoded to: $certPath"
          echo "CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Sign Windows binaries
        if: secrets.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certPath = $env:CERT_PATH

          # Sign all .exe files in dist/
          Get-ChildItem -Path dist -Filter *.exe | ForEach-Object {
            Write-Host "Signing: $($_.FullName)"

            & .\installer\windows\sign-binary.ps1 `
              -CertificatePath $certPath `
              -Password $env:CERTIFICATE_PASSWORD `
              -FilePath $_.FullName `
              -Verify $true

            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $($_.Name)"
            }
          }

      - name: Clean up certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:CERT_PATH -and (Test-Path $env:CERT_PATH)) {
            Remove-Item -Path $env:CERT_PATH -Force
            Write-Host "Certificate file removed"
          }

      - name: Upload signed binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-windows-${{ matrix.goarch }}-signed
          path: dist/*
          retention-days: 7

  sign-macos:
    name: Sign and Notarize macOS Binaries
    runs-on: macos-latest
    needs: build
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && secrets.MACOS_CERTIFICATE_BASE64 != '')

    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS binary artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-darwin-${{ matrix.goarch }}
          path: dist

      - name: Import signing certificate
        if: secrets.MACOS_CERTIFICATE_BASE64 != ''
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-keychain-password' }}
        run: |
          # Decode certificate from base64
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Import certificate to keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Allow codesign to access keychain without user prompt
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

          # Clean up certificate file
          rm -f certificate.p12

          echo "Certificate imported successfully"

      - name: Sign macOS binaries
        if: secrets.MACOS_CERTIFICATE_BASE64 != ''
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY || 'Developer ID Application' }}
        run: |
          # Sign all binaries in dist/
          for binary in dist/*; do
            if [ -f "$binary" ]; then
              echo "Signing: $binary"

              chmod +x scripts/sign-macos.sh
              ./scripts/sign-macos.sh \
                --identity "$CODESIGN_IDENTITY" \
                --binary "$binary"

              if [ $? -ne 0 ]; then
                echo "Error: Signing failed for $binary"
                exit 1
              fi
            fi
          done

      - name: Notarize macOS binaries
        if: secrets.MACOS_CERTIFICATE_BASE64 != '' && secrets.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Notarize all binaries in dist/
          for binary in dist/*; do
            if [ -f "$binary" ]; then
              echo "Notarizing: $binary"

              chmod +x scripts/notarize-macos.sh
              ./scripts/notarize-macos.sh \
                --binary "$binary" \
                --bundle-id "com.patchiq.agent"

              if [ $? -ne 0 ]; then
                echo "Warning: Notarization failed for $binary"
                echo "Binary is signed but not notarized. Users may see warnings."
                # Don't fail the build - notarization can be done later
              fi
            fi
          done

      - name: Verify signatures
        run: |
          # Verify all binaries in dist/
          for binary in dist/*; do
            if [ -f "$binary" ]; then
              echo "Verifying: $binary"

              chmod +x scripts/verify-macos-signature.sh
              ./scripts/verify-macos-signature.sh "$binary" || true
            fi
          done

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          echo "Keychain cleaned up"

      - name: Upload signed binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-darwin-${{ matrix.goarch }}-signed
          path: dist/*
          retention-days: 7

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, sign-windows, sign-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries

      - name: Organize signed binaries
        run: |
          # Move signed Windows binaries to replace unsigned ones
          if [ -d "release-binaries/agent-windows-amd64-signed" ]; then
            rm -rf release-binaries/agent-windows-amd64
            mv release-binaries/agent-windows-amd64-signed release-binaries/agent-windows-amd64
            echo "Using signed Windows amd64 binaries"
          fi

          if [ -d "release-binaries/agent-windows-arm64-signed" ]; then
            rm -rf release-binaries/agent-windows-arm64
            mv release-binaries/agent-windows-arm64-signed release-binaries/agent-windows-arm64
            echo "Using signed Windows arm64 binaries"
          fi

          # Move signed macOS binaries to replace unsigned ones
          if [ -d "release-binaries/agent-darwin-amd64-signed" ]; then
            rm -rf release-binaries/agent-darwin-amd64
            mv release-binaries/agent-darwin-amd64-signed release-binaries/agent-darwin-amd64
            echo "Using signed macOS amd64 binaries"
          fi

          if [ -d "release-binaries/agent-darwin-arm64-signed" ]; then
            rm -rf release-binaries/agent-darwin-arm64
            mv release-binaries/agent-darwin-arm64-signed release-binaries/agent-darwin-arm64
            echo "Using signed macOS arm64 binaries"
          fi

      - name: Create checksums
        run: |
          cd release-binaries

          # Create individual .sha256 files and combined checksums.txt
          for dir in agent-*; do
            if [ -d "$dir" ]; then
              cd "$dir"
              for file in *; do
                if [ -f "$file" ]; then
                  # Create individual .sha256 file
                  sha256sum "$file" > "${file}.sha256"

                  # Append to combined checksums file
                  sha256sum "$file" >> ../checksums.txt

                  echo "Created checksum for: $file"
                fi
              done
              cd ..
            fi
          done

          echo ""
          echo "Combined checksums:"
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-binaries/**/*
            release-binaries/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-before-release:
    name: Run Tests Before Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Run all tests
        working-directory: ./agent
        run: |
          go test -v -race ./internal/...
          go test -v ./test/integration/...

      - name: Verify build
        working-directory: ./agent
        run: go build -v ./cmd/agent
