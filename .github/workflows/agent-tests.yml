name: Agent Tests

on:
  push:
    branches:
      - main
      - 'full-dev-*'
    paths:
      - 'agent/**'
      - '.github/workflows/agent-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'agent/**'
      - '.github/workflows/agent-tests.yml'

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Install dependencies
        working-directory: ./agent
        run: go mod download

      - name: Run unit tests
        working-directory: ./agent
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./internal/...
        timeout-minutes: 10

      - name: Run integration tests
        working-directory: ./agent
        run: go test -v ./test/integration/...
        if: matrix.os != 'windows-latest'
        timeout-minutes: 15

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./agent/coverage.txt
          flags: agent-${{ matrix.os }}
          name: agent-coverage-${{ matrix.os }}
          fail_ci_if_error: false

      - name: Generate coverage report
        working-directory: ./agent
        run: go tool cover -html=coverage.txt -o coverage.html
        if: always()

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: agent/coverage.html
          retention-days: 7
        if: always()

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: agent/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: ./agent
          args: --timeout=5m

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Build agent binary
        working-directory: ./agent
        run: go build -v -o patchify-agent ./cmd/agent

      - name: Verify binary
        working-directory: ./agent
        run: |
          if [ ! -f patchify-agent ]; then
            echo "Binary was not created"
            exit 1
          fi
          file patchify-agent
          ls -lh patchify-agent

  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-reports

      - name: Display coverage summary
        run: |
          echo "## Coverage Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for dir in coverage-reports/coverage-*; do
            if [ -d "$dir" ]; then
              os=$(basename $dir | sed 's/coverage-//')
              echo "- $os: Available" >> $GITHUB_STEP_SUMMARY
            fi
          done
