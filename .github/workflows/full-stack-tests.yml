name: Full Stack Integration Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'docker-compose.yml'
      - '.github/workflows/full-stack-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'docker-compose.yml'
      - '.github/workflows/full-stack-tests.yml'
  # Manual trigger for full stack testing
  workflow_dispatch:

# Cancel in-progress runs for the same PR
concurrency:
  group: full-stack-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'
  CACHE_VERSION: v1

jobs:
  # ============================================================================
  # Job 1: Full Infrastructure Setup
  # ============================================================================
  full-infrastructure:
    name: Full Infrastructure Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: patchiq
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000
          - 9001:9001

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            shared/package-lock.json

      - name: Install shared dependencies
        run: cd shared && npm ci

      - name: Generate shared types
        run: cd shared && npm run generate

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Setup database
        run: |
          cd backend
          npx prisma migrate deploy
          npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patchiq

      - name: Initialize MinIO buckets
        run: |
          # Wait for MinIO to be ready
          timeout 30 bash -c 'until curl -f http://localhost:9000/minio/health/live 2>/dev/null; do sleep 2; done'

          # Install MinIO client
          wget -q https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc

          # Configure MinIO client
          ./mc alias set myminio http://localhost:9000 minioadmin minioadmin

          # Create required buckets
          ./mc mb myminio/patchiq-packages || true
          ./mc mb myminio/patchiq-scripts || true
          ./mc mb myminio/patchiq-logs || true

          echo "✅ MinIO buckets created"

      - name: Start backend server
        run: |
          cd backend
          npm run dev &

          # Wait for backend to be ready
          timeout 90 bash -c 'until curl -f http://localhost:3000/health 2>/dev/null; do sleep 2; done'
          echo "✅ Backend server ready"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patchiq
          REDIS_URL: redis://localhost:6379
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_USE_SSL: false
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test

      - name: Start frontend server
        run: |
          cd frontend
          npm run dev &

          # Wait for frontend to be ready
          timeout 90 bash -c 'until curl -f http://localhost:5173 2>/dev/null; do sleep 2; done'
          echo "✅ Frontend server ready"

      - name: Run full stack E2E tests
        run: cd frontend && npx playwright test --project=chromium
        env:
          CI: true

      - name: Test file upload workflow
        run: |
          cd frontend
          # Run tests that specifically test MinIO integration
          npx playwright test --grep @file-upload --project=chromium
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-test-results
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend/logs
            frontend/logs
          retention-days: 7

  # ============================================================================
  # Job 2: Real Database Scenarios
  # ============================================================================
  database-scenarios:
    name: Real Database Scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: patchiq
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            shared/package-lock.json

      - name: Install dependencies
        run: |
          cd shared && npm ci
          cd ../backend && npm ci

      - name: Setup database
        run: |
          cd backend
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patchiq

      - name: Test 1 - Minimal dataset
        run: |
          cd backend
          npm run generate:test-data:minimal

          # Verify data was created
          npx prisma db execute --stdin <<SQL
            SELECT COUNT(*) FROM "User";
            SELECT COUNT(*) FROM "Agent";
            SELECT COUNT(*) FROM "Asset";
          SQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patchiq

      - name: Test 2 - Standard dataset
        run: |
          cd backend
          npx prisma migrate reset --force --skip-seed
          npm run generate:test-data:standard

          # Verify relationships
          npx prisma db execute --stdin <<SQL
            SELECT COUNT(*) FROM "Deployment";
            SELECT COUNT(*) FROM "Job";
          SQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patchiq

      - name: Test 3 - Transaction scenarios
        run: |
          cd backend
          npm run test:integration -- --grep transaction
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patchiq
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Test 4 - Concurrent operations
        run: |
          cd backend
          # Test concurrent writes to database
          npm run test:integration -- --grep concurrent
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patchiq
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  # ============================================================================
  # Job 3: Real MinIO Upload Tests
  # ============================================================================
  minio-upload-tests:
    name: Real MinIO Upload Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: patchiq
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            shared/package-lock.json

      - name: Install dependencies
        run: |
          cd shared && npm ci
          cd ../backend && npm ci

      - name: Setup database
        run: |
          cd backend
          npx prisma migrate deploy
          npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patchiq

      - name: Initialize MinIO
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:9000/minio/health/live 2>/dev/null; do sleep 2; done'

          wget -q https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          ./mc alias set myminio http://localhost:9000 minioadmin minioadmin
          ./mc mb myminio/patchiq-packages || true
          ./mc mb myminio/patchiq-scripts || true

      - name: Test package upload
        run: |
          cd backend
          # Create a test package
          echo "test package content" > test-package.tar.gz

          # Test upload via API
          npm run test:e2e -- --grep "package upload"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patchiq
          REDIS_URL: redis://localhost:6379
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_USE_SSL: false
          JWT_SECRET: test-jwt-secret

      - name: Verify uploaded files
        run: |
          ./mc ls myminio/patchiq-packages
          echo "✅ MinIO upload tests passed"

  # ============================================================================
  # Job 4: Workflow Integration Tests
  # ============================================================================
  workflow-integration:
    name: Workflow Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: patchiq
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            shared/package-lock.json

      - name: Install dependencies
        run: |
          cd shared && npm ci
          cd ../backend && npm ci

      - name: Setup infrastructure
        run: |
          cd backend
          npx prisma migrate deploy
          npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patchiq

      - name: Test complete workflow
        run: |
          cd backend
          npm run test:e2e:workflow
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patchiq
          REDIS_URL: redis://localhost:6379
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_USE_SSL: false
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test

  # ============================================================================
  # Job 5: Test Summary
  # ============================================================================
  test-summary:
    name: Full Stack Test Summary
    runs-on: ubuntu-latest
    needs: [full-infrastructure, database-scenarios, minio-upload-tests, workflow-integration]
    if: always()

    steps:
      - name: Generate test summary
        run: |
          echo "# Full Stack Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Full Infrastructure | ${{ needs.full-infrastructure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Database Scenarios | ${{ needs.database-scenarios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MinIO Upload Tests | ${{ needs.minio-upload-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow Integration | ${{ needs.workflow-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "Full stack integration tests verify the complete application stack:" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend + Backend + Database + Redis + MinIO" >> $GITHUB_STEP_SUMMARY
          echo "- Real database transactions and scenarios" >> $GITHUB_STEP_SUMMARY
          echo "- Real file uploads to MinIO" >> $GITHUB_STEP_SUMMARY
          echo "- Complete deployment workflows" >> $GITHUB_STEP_SUMMARY

      - name: Check overall status
        run: |
          if [ "${{ needs.full-infrastructure.result }}" != "success" ] || \
             [ "${{ needs.database-scenarios.result }}" != "success" ] || \
             [ "${{ needs.workflow-integration.result }}" != "success" ]; then
            echo "::error::One or more full stack test jobs failed"
            exit 1
          fi
